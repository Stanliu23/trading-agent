# Every approved number lives here. Source of truth: docs/SPEC.md.
# Personal details (email addresses) go in config.local.yaml, which is never committed.

version: 1
mode: shadow                 # shadow = emails marked SHADOW, you don't act. Switch to live after the 2-week run.
timezone: America/New_York

account:
  broker: schwab_international
  reader: undecided          # schwab_api | csv | undecided  (decided in Phase 2)
  currency: USD
  starting_balance: 300
  fractional_shares: true    # you believe this works; verified in Phase 0
  allow_orders: false        # hard rule: the agent never places orders
  allow_shorts: false

universe:
  markets: [us_stocks, us_etfs]

# Moderate from the start (aggressive start skipped 2026-11-18). If start_profile is aggressive,
# it applies until account value first reaches the switch level, then moderate for good.
profiles:
  start_profile: moderate
  switch_to_moderate_at: 1000
  aggressive:
    max_loss_per_trade: 0.03
    tier3_max_loss_per_trade: 0.015
    drawdown_pause: 0.25
    rank_by: expected_return
    buckets:   # 40% long-term / 60% short-term (approved 2026-11-18)
      long_term:  {target: 0.40, min: 0.35, max: 0.45}
      short_term: {target: 0.60, min: 0.55, max: 0.65}
  moderate:
    max_loss_per_trade: 0.02
    tier3_max_loss_per_trade: 0.01
    drawdown_pause: 0.15
    rank_by: stars
    buckets:   # 40% long-term / 60% short-term (approved 2026-11-18)
      long_term:  {target: 0.40, min: 0.35, max: 0.45}
      short_term: {target: 0.60, min: 0.55, max: 0.65}

# The goal (approved 2026-11-18): short-term trading must earn more than the same money held in the
# long-term index funds. Checked every weekly review over the last 3 months (63 sessions).
goal:
  benchmark: [VTI, QQQ, SCHD]      # equal-weight
  window_sessions: 63
  pause_short_term_if_behind: true  # stop new short-term recommendations
  # While paused, recommendations keep being tracked on paper. When that paper book is no longer behind
  # the index funds over the same window, the agent asks to restart; you approve (approved 2026-11-18).
  restart_when_paper_book_recovers: true
  restart_needs_approval: true

# A setup is rated only if it clears all of these.
evidence:
  min_trades: 30
  min_history_years: 5
  require_positive_holdout: true
  min_edge: 2                     # only setups scoring >= 2 of 5 on Edge are recommended (approved 2026-11-18)

backtest:
  history_start: "2015-01-01"
  end: "2025-12-31"
  holdout_start: "2024-01-01"     # last 2 years are never used to design setups; they only check them
  round_trip_cost: 0.001          # 0.1% per round trip (spread + slippage; Schwab commission is $0)
  long_term_history_start: "2005-01-01"  # long-term setups use more history (includes 2008)
  long_term_horizon_days: 756     # long-term setups are scored on 3-year forward returns
  long_term_holdout_years: 2      # held-out = last 2 years of entries that have a full 3 years of data

# Score mappings (approved 2026-11-18). Stars = average of the sub-scores, rounded half up.
scoring:
  edge_swing_r:   [0.0, 0.05, 0.10, 0.20, 0.30]   # held-out expectancy in R; above each step adds 1 point (max 5)
  edge_long_term: [0.0, 0.10, 0.20, 0.30, 0.40]   # mean 3-year return; same stepping
  confidence_trades: [30, 100, 300]               # 2 / 3 / 4 points at these trade counts
  confidence_years_positive: 0.70                 # +1 if at least this share of calendar years were positive
  confidence_holdout_decay: 0.5                   # -1 if held-out expectancy < half of in-sample
  fit_correlation: [0.2, 0.4, 0.6, 0.8, 0.9]      # Fit = 5 minus the steps the idea's 60-day correlation with your holdings exceeds

# Idle cash (approved 2026-11-18): uninvested cash in either bucket is parked in a T-bill ETF and sold
# first when a trade needs it. Amounts under min_park_usd stay as plain cash.
cash:
  park_idle_in: BIL
  min_park_usd: 20

positions:
  max_position_pct: 0.25          # no single position above 25% of account value
  min_position_usd: 20            # smaller amounts stay as cash (approved 2026-11-18)
  skip_entries_before_earnings: true   # no new short-term stock entry if earnings fall before the planned exit

tiers:
  # tail = the 5th-percentile trade (1 in 20 trades did worse)
  tier1: {max_loss_rate: 0.25, max_tail_loss: 0.08}
  tier2: {max_loss_rate: 0.40, max_tail_loss: 0.15}
  # tier3: anything else that clears `evidence`, sized at tier3_max_loss_per_trade

stars:
  components: [edge, confidence, fit]   # each 0-5, stars = average rounded to nearest whole star
  scale: 5

triggers:
  move_sigma: 2.0
  urgent_move_sigma: 3.0
  sigma_lookback_days: 60    # tuned in Phase 4 replay
  earnings_within_days: 3

market_data:
  primary: yahoo             # free, no key, unofficial (can rate-limit)
  crosscheck: null           # Finnhub cross-check skipped for now (2026-11-18); set to finnhub to turn it back on
  max_disagreement: 0.01     # used only when a crosscheck source is set
  # Schwab's market data replaces both if API access is approved (Phase 2).

news:
  sources: [yahoo_finance, sec_edgar]
  min_similar_events: 10

schedule:
  intraday: {every_minutes: 15, start: "09:30", end: "16:00"}
  premarket: "08:00"
  close: "16:30"
  weekly: {day: saturday, time: "09:00"}

review:
  recurrence: {count: 3, weeks: 4}

schwab:
  login_reminder_day: 6
