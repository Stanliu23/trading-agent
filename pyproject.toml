[project]
name = "tradeagent"
version = "0.1.0"
description = "Personal read-only trading research agent for a Schwab account, built on Vibe-Trading."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "exchange-calendars>=4.5",
    "pandas>=2.1",
    "keyring>=25.0",
]

[project.optional-dependencies]
# Installed from Phase 5 on. Pinned to the commit the design was reviewed against.
analyst = [
    "vibe-trading-ai @ git+https://github.com/HKUDS/Vibe-Trading.git@ebc849b37597f0d944f2a268178efaf9d6109c4d",
]

[project.scripts]
tradeagent = "tradeagent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tradeagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
